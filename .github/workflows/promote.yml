name: Promote to Main
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
jobs:
  promote:
    runs-on: ubuntu-latest
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body &&
      contains(github.event.comment.body, '/promote')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote PR to main
        uses: korthout/backport-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_pr_number: ${{ github.event.issue.number }}
          target_branches: main
          cherry_picking: auto
          branch_name: promote-${pull_number}-to-main
          pull_title: '[Promote] ${pull_title}'
          pull_description: |
            Automatic promotion of #${pull_number} to `main`

            **Original PR**: #${pull_number}

            ---
            ${pull_description}
          merge_commits: skip
          add_labels: needs-qa,promoted-from-develop
