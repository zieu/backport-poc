on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: >
      github.event.pull_request.merged &&
      github.event.pull_request.base.ref == 'develop' &&
      contains(github.event.pull_request.labels.*.name, 'promote-to-main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote PR to main
        uses: korthout/backport-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_pr_number: ${{ github.event.issue.number }}
          target_branches: main
          cherry_picking: auto
          pull_description: |
            Automated forward-port to main.
            Triggered by /promote command.
