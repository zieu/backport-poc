name: Promote to Main via Backport

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/promote')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote PR to main
        uses: korthout/backport-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_pr_number: ${{ github.event.issue.number }}
          target_branches: main
          cherry_picking: auto
          branch_name: promote-pr-${source_pr_number}-to-main
          pull_title: '[Promote] #{pull_number} → main'
          pull_description: |
            Automated forward-port to main.
            Triggered by /promote command.
